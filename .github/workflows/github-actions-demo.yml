name: CI-CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-archive:
    runs-on: ubuntu-latest  # Runs on GitHub's cloud, not your EC2
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Package
        run: |
          mkdir -p deployment_package
          cp app.js deployment_package/
          echo "Build Version: ${GITHUB_SHA}" > deployment_package/version.txt

      - name: Save to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: approved-code-package
          path: deployment_package/
