name: CI-CD Build and Deploy

on:
  push:
    branches:
      - main  # This only runs AFTER you merge the PR

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Build Artifact
        run: |
          mkdir -p build
          cp app.js build/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: build

  deploy:
    needs: build
    runs-on: self-hosted  # Your EC2 GitHub Runner
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-files

      - name: Deploy to App Folder
        run: |
          sudo mkdir -p /home/ubuntu/app
          sudo cp -r * /home/ubuntu/app/
          echo "Deployment successful to EC2!"
